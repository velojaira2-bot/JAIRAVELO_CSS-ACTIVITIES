<!DOCTYPE html>
<html lang="en">
<head>

    <title>Goal 10</title>
</head>
    <style>
        * {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 15px;
    background: white;
}

h1 {
    margin: 0 0 70px;
    font-family: "Times New Roman", serif;
    font-size: 58px;
}

.box {
    display: block;
    width: 545px;
    height: 545px;
    margin-bottom: 40px;
    color: white;
    font-family: "Times New Roman", serif;
    font-size: 30px;
}

.red {
    background: red;
}

.green {
    background: green;
}

.blue {
    background: blue;
}
    </style>
<body>
    <h1>CSS Display Property</h1>

    <div class="container">
        <div class="box red">Red Paragraph</div>
        <div class="box green">Green Paragraph</div>
        <div class="box blue">Blue Paragraph</div>
    </div>
</body>
